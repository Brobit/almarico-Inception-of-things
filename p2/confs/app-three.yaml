apiVersion: v1
kind: ConfigMap
metadata:
  name: app-three
data:
  default.conf.template: |
    server {
      listen 80;
      location / {
        default_type text/plain;
        return 200 "Hello from app3 (pod: ${HOSTNAME})\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-three
spec:
  replicas: 1
  selector:
    matchLabels: { app: app-three }
  template:
    metadata:
      labels: { app: app-three }
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/templates }
      volumes:
        - name: conf
          configMap: { name: app-three }
---
apiVersion: v1
kind: Service
metadata:
  name: app-three
spec:
  selector: { app: app-three }
  ports: [{ port: 80, targetPort: 80 }]
